<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Image Library</h1>
    </header>

    <main class="gallery">

        <article class="card" style="--i:0;" tabindex="0">
            <div class="image">
                <img src="1.jpg" alt="Image 1">
            </div>
        </article>

        <article class="card" style="--i:1;" tabindex="0">
            <div class="image">
                <img src="2.jpg" alt="Image 2">
            </div>
        </article>

        <article class="card" style="--i:2;" tabindex="0">
            <div class="image">
                <img src="3.jpg" alt="Image 3">
            </div>
        </article>

        <article class="card" style="--i:3;" tabindex="0">
            <div class="image">
                <img src="4.jpg" alt="Image 4">
            </div>
        </article>

        <article class="card" style="--i:4;" tabindex="0">
            <div class="image">
                <img src="5.jpg" alt="Image 5">
            </div>
        </article>

        <article class="card" style="--i:5;" tabindex="0">
            <div class="image">
                <img src="6.jpg" alt="Image 6">
            </div>
        </article>

        <article class="card" style="--i:6;" tabindex="0">
            <div class="image">
                <img src="7.jpg" alt="Image 7">
            </div>
        </article>

        <article class="card" style="--i:7;" tabindex="0">
            <div class="image">
                <img src="8.jpg" alt="Image 8">
            </div>
        </article>

        <article class="card" style="--i:8;" tabindex="0">
            <div class="image">
                <img src="9.jpg" alt="Image 9">
            </div>
        </article>

    </main>

</body>

</html>
